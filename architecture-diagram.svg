<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#666"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#0066cc"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#2ca02c"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#d13438"/>
        </marker>
    </defs>

    <!-- Backing rect -->
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Title -->
    <text x="450" y="20" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">TrackHub System Architecture &amp; Integrations</text>

    <!-- ROW 2: API CONTAINER -->
    <rect x="50" y="110" width="760" height="110" rx="6" fill="#fcfcfc" stroke="#aaa" stroke-width="2"/>
    <text x="65" y="135" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#444">TrackHub.Api (Endpoints &amp; Jobs)</text>

    <!-- ROW 3: APP CONTAINER -->
    <rect x="50" y="250" width="760" height="110" rx="6" fill="#fff9ec" stroke="#d98c00" stroke-width="2"/>
    <text x="65" y="275" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#b37300">TrackHub.Application (Business Logic)</text>

    <!-- ROW 4: DB CONTAINER -->
    <rect x="50" y="400" width="760" height="120" rx="6" fill="#fdf2f4" stroke="#d13438" stroke-width="2"/>
    <text x="65" y="425" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a02022">Oracle Database</text>

    <!-- ==================== ELEMENTS ==================== -->
    
    <!-- Row 1: External Sources -->
    <!-- SFTP Storage Box (Separate Box) -->
    <rect x="90" y="40" width="140" height="40" rx="4" fill="#e8f4fa" stroke="#007acc" stroke-width="1.5"/>
    <text x="160" y="65" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#005a9e">&#x1F4BE; SFTP Storage</text>

    <!-- Carrier REST Integrations -->
    <rect x="250" y="40" width="140" height="40" rx="4" fill="#e8f4fa" stroke="#007acc" stroke-width="1.5"/>
    <text x="320" y="65" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#005a9e">&#x1F310; Carrier REST API</text>

    <!-- Carrier Webhooks -->
    <rect x="440" y="40" width="140" height="40" rx="4" fill="#e8f4fa" stroke="#007acc" stroke-width="1.5"/>
    <text x="510" y="65" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#005a9e">&#x1F4E2; Carrier Webhooks</text>

    <!-- Merchants Box -->
    <rect x="620" y="30" width="160" height="50" rx="4" fill="#f4f9ea" stroke="#2ca02c" stroke-width="1.5"/>
    <text x="700" y="52" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e711e">Merchants</text>
    <text x="700" y="70" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#333">API &amp; Dashboard</text>

    <!-- Row 2: API blocks -->
    <rect x="170" y="155" width="140" height="40" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="240" y="180" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#222">CarrierPollJob</text>

    <rect x="440" y="155" width="310" height="40" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="595" y="180" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">TrackingController</text>

    <!-- Row 3: App blocks -->
    <rect x="180" y="295" width="370" height="50" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="365" y="315" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">EventIngestionService</text>
    <text x="365" y="335" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#666">Applies ConnectorFactory &amp; Parses data</text>

    <rect x="630" y="295" width="140" height="45" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="700" y="322" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#222">ShipmentReportService</text>

    <!-- Row 4: DB blocks -->
    <rect x="250" y="450" width="230" height="45" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="365" y="477" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a02022">pkg_event_ingest PL/SQL</text>

    <!-- Database tables -->
    <rect x="600" y="435" width="180" height="30" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="690" y="455" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#444">tracking_events</text>
    <rect x="600" y="470" width="180" height="30" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="690" y="490" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#444">shipments</text>

    <!-- ==================== ARROWS & LINES ==================== -->
    
    <!-- SFTP -> PollJob -->
    <polyline points="160,80 160,95 210,95 210,152" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="165" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">File Stream</text>
    
    <!-- REST -> PollJob -->
    <polyline points="320,80 320,95 270,95 270,152" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="275" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">API Poll</text>

    <!-- Webhook -> TrackingController -->
    <polyline points="510,80 510,152" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="515" y="100" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">HTTP POST</text>

    <!-- Merchants -> Reports Endpoint (Reads) / GET Request -->
    <polyline points="700,80 700,152" fill="none" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="705" y="100" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e711e">GET /summary</text>

    <!-- PollJob -> IngestService -->
    <polyline points="240,195 240,235 310,235 310,292" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="245" y="230" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">Payload Stream</text>

    <!-- TrackingController -> IngestService -->
    <polyline points="510,195 510,235 410,235 410,292" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="415" y="230" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">Payload Stream</text>

    <!-- ReportsEp -> ReportService -->
    <polyline points="700,195 700,292" fill="none" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- IngestService -> Database PKG -->
    <polyline points="365,345 365,447" fill="none" stroke="#007acc" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="375" y="395" font-family="Segoe UI, sans-serif" font-size="11" fill="#005a9e">Execute Package</text>

    <!-- PKG -> Tables -->
    <polyline points="480,472 597,472" fill="none" stroke="#d13438" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="495" y="465" font-family="Segoe UI, sans-serif" font-size="11" fill="#a02022">State Modifies</text>

    <!-- ReportService -> Tables (Queries) -->
    <polyline points="700,340 700,432" fill="none" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="705" y="395" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e711e">EF Core Queries</text>
    
    <!-- Return Responses (Dashed) -->
    <polyline points="680,435 680,340" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <polyline points="680,295 680,195" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <polyline points="680,155 680,80" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

</svg>